name: i18n parity check

on:
  push:
    branches:
      - main
      - authentication
  pull_request:

jobs:
  i18n-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar paridad de keys i18n (es/en/fr/pt)
        run: node scripts/i18n-check.mjs
