name: Mobile release

# Compila, firma y publica las apps (Capacitor) en App Store y Play Store.
# Se lanza a mano (o vía API) sobre la rama de las apps. Las llaves vienen de
# los secretos del repo; ver fastlane/Fastfile.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Rama a publicar
        default: feat/ios-iap-revenuecat
        required: true
      platform:
        description: Plataforma
        type: choice
        options: [both, ios, android, ios-submit]
        default: both
      release_notes:
        description: Notas de la versión (español)
        required: true

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  web:
    if: inputs.platform != 'ios-submit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx nx build catalogohoy --configuration=production
      # Sin sourcemaps dentro de las apps.
      - run: find dist/apps/catalogohoy/browser -name '*.map' -delete
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/apps/catalogohoy/browser
          retention-days: 3

  android:
    needs: web
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist/apps/catalogohoy/browser
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Llaves de Android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
      - run: npx cap sync android
      - name: Publicar en Play Store
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: bundle exec fastlane android release

  ios:
    needs: web
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    # Apple exige el SDK de iOS 26 (Xcode 26) para subir builds.
    runs-on: macos-26
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist/apps/catalogohoy/browser
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Llaves de iOS
        env:
          GOOGLE_SERVICE_INFO_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: echo "$GOOGLE_SERVICE_INFO_BASE64" | base64 -d > ios/App/App/GoogleService-Info.plist
      - run: npx cap sync ios
      # Llave privada del certificado de distribución, cifrada con la API key.
      # Se guarda como artifact en cada versión y se toma del último, así se
      # reutiliza siempre el mismo certificado (Apple limita cuántos hay).
      - name: Certificado de distribución
        env:
          GH_TOKEN: ${{ github.token }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p build/certs
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ios-dist-cert&per_page=20" \
            -q '[.artifacts[] | select(.expired == false)][0].id // empty')
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > /tmp/ios-dist-cert.zip
            unzip -p /tmp/ios-dist-cert.zip ios-dist-cert.enc | base64 -d \
              | openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ASC_KEY_P8_BASE64 \
              | tar xz -C build/certs
            echo "Certificado previo restaurado"
          fi
      - name: Publicar en App Store
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          # Resolver los paquetes SPM puede tardar; fastlane corta a los ~3 s.
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '120'
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: '5'
        run: bundle exec fastlane ios release
      - name: Guardar certificado
        if: always()
        id: newcert
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if ls build/certs/*.p12 >/dev/null 2>&1; then
            tar cz -C build/certs $(cd build/certs && ls *.p12) \
              | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ASC_KEY_P8_BASE64 \
              | base64 > ios-dist-cert.enc
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.newcert.outputs.found == 'true'
        with:
          name: ios-dist-cert
          path: ios-dist-cert.enc
          retention-days: 90

  # Reintenta solo el envío a revisión de un build ya subido (sin compilar).
  ios-submit:
    if: inputs.platform == 'ios-submit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Enviar a revisión de Apple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: bundle exec fastlane ios submit
