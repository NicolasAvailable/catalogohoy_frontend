name: CI + Discord Notify (main/authentication)

on:
  push:
    branches:
      - main
      - authentication

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) Capturar hora de inicio (UTC) y guardarla para pasos siguientes
      - name: Set start time
        id: start
        run: |
          echo "START_EPOCH=$(date +%s)" >> $GITHUB_ENV
          echo "START_ISO=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      # 2) Notificar inicio a Discord (incluye rama y hora)
      - name: Notify Discord (start)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          SHA: ${{ github.sha }}
          START_ISO: ${{ env.START_ISO }}
        run: |
          curl -H "Content-Type: application/json" -X POST -d "{
            \"content\": \"🚀 **Build started**\\nRepo: **${REPO}**\\nBranch: **${BRANCH}**\\nBy: **${ACTOR}**\\nStart: **${START_ISO}**\\nCommit: ${COMMIT_URL}\\nRun: ${RUN_URL}\\nSHA: \`${SHA:0:7}\`\"
          }" "$DISCORD_WEBHOOK_URL"

      # 3) Build real
      - name: Checkout
        uses: actions/checkout@v4

      # Ajusta esto a tu proyecto (si usas pnpm/yarn/nx me dices y lo adapto)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # 4) Notificar fin OK (con hora fin + duración)
      - name: Notify Discord (success)
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          START_EPOCH: ${{ env.START_EPOCH }}
        run: |
          END_EPOCH=$(date +%s)
          END_ISO=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          DURATION=$((END_EPOCH-START_EPOCH))

          curl -H "Content-Type: application/json" -X POST -d "{
            \"content\": \"✅ **Build finished (SUCCESS)**\\nRepo: **${REPO}**\\nBranch: **${BRANCH}**\\nBy: **${ACTOR}**\\nEnd: **${END_ISO}**\\nDuration: **${DURATION}s**\\nCommit: ${COMMIT_URL}\\nRun: ${RUN_URL}\"
          }" "$DISCORD_WEBHOOK_URL"

      # 5) Notificar fin FAIL (con hora fin + duración)
      - name: Notify Discord (failure)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          START_EPOCH: ${{ env.START_EPOCH }}
        run: |
          END_EPOCH=$(date +%s)
          END_ISO=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          DURATION=$((END_EPOCH-START_EPOCH))

          curl -H "Content-Type: application/json" -X POST -d "{
            \"content\": \"❌ **Build finished (FAILED)**\\nRepo: **${REPO}**\\nBranch: **${BRANCH}**\\nBy: **${ACTOR}**\\nEnd: **${END_ISO}**\\nDuration: **${DURATION}s**\\nCommit: ${COMMIT_URL}\\nRun: ${RUN_URL}\"
          }" "$DISCORD_WEBHOOK_URL"
