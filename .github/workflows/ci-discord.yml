name: CI + Discord Notify

on:
  push:
    branches:
      - main
      - authentication

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set start time
        run: |
          echo "START_EPOCH=$(date +%s)" >> $GITHUB_ENV
          echo "START_ISO=$(TZ='America/Caracas' date +'%d/%m/%Y - %I:%M %p')" >> $GITHUB_ENV

      - name: Notify Discord (start) - embed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          SHA: ${{ github.sha }}
          START_ISO: ${{ env.START_ISO }}
        run: |
          payload=$(cat << 'JSON'
          {
            "username": "GitHub Actions",
            "embeds": [
              {
                "title": "🚀 CI started",
                "color": 16449320,
                "fields": [
                  { "name": "📦 Project", "value": "__REPO__", "inline": true },
                  { "name": "🌿 Branch", "value": "__BRANCH__", "inline": true },
                  { "name": "⚙️ State", "value": "RUNNING", "inline": true },
                  { "name": "🔗 Run", "value": "[Open workflow run](__RUN_URL__)", "inline": false },
                  { "name": "🧾 Commit", "value": "[__SHA7__](__COMMIT_URL__)", "inline": false },
                  { "name": "🕒 Started", "value": "__START__", "inline": false }
                ],
                "footer": { "text": "CatalogoHoy · GitHub Actions" }
              }
            ]
          }
          JSON
          )

          payload=${payload/__REPO__/$REPO}
          payload=${payload/__BRANCH__/$BRANCH}
          payload=${payload/__RUN_URL__/$RUN_URL}
          payload=${payload/__COMMIT_URL__/$COMMIT_URL}
          payload=${payload/__START__/$START_ISO}
          payload=${payload/__SHA7__/$(echo $SHA | cut -c1-7)}

          curl -sS -H "Content-Type: application/json" -X POST -d "$payload" "$DISCORD_WEBHOOK_URL" || true

      - name: Checkout
        uses: actions/checkout@v4

      # --- BUILD (ajusta a tu proyecto) ---
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install

      - name: Build
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            npm run build:catalogohoy
          elif [ "${{ github.ref_name }}" == "authentication" ]; then
            npm run build:authentication
          else
            echo "Branch ${{ github.ref_name }} doesn't have a specific build target. Running default build."
            npm run build
          fi
      # -----------------------------------
      - name: Notify Discord (success) - embed
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          START_EPOCH: ${{ env.START_EPOCH }}
        run: |
          END_EPOCH=$(date +%s)
          DURATION=$((END_EPOCH-START_EPOCH))

          payload=$(cat << 'JSON'
          {
            "username": "GitHub Actions",
            "embeds": [
              {
                "title": "✅ CI finished",
                "color": 2278751,
                "fields": [
                  { "name": "📦 Project", "value": "__REPO__", "inline": true },
                  { "name": "🌿 Branch", "value": "__BRANCH__", "inline": true },
                  { "name": "⚙️ State", "value": "SUCCESS", "inline": true },
                  { "name": "⏱️ Duration", "value": "__DURATION__s", "inline": false },
                  { "name": "🔗 Run", "value": "[Open workflow run](__RUN_URL__)", "inline": false }
                ],
                "footer": { "text": "CatalogoHoy · GitHub Actions" }
              }
            ]
          }
          JSON
          )

          payload=${payload/__REPO__/$REPO}
          payload=${payload/__BRANCH__/$BRANCH}
          payload=${payload/__RUN_URL__/$RUN_URL}
          payload=${payload/__DURATION__/$DURATION}

          curl -sS -H "Content-Type: application/json" -X POST -d "$payload" "$DISCORD_WEBHOOK_URL" || true

      - name: Notify Discord (failure) - embed
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          START_EPOCH: ${{ env.START_EPOCH }}
        run: |
          END_EPOCH=$(date +%s)
          DURATION=$((END_EPOCH-START_EPOCH))

          payload=$(cat << 'JSON'
          {
            "username": "GitHub Actions",
            "embeds": [
              {
                "title": "❌ CI failed",
                "color": 15548997,
                "fields": [
                  { "name": "📦 Project", "value": "__REPO__", "inline": true },
                  { "name": "🌿 Branch", "value": "__BRANCH__", "inline": true },
                  { "name": "⚙️ State", "value": "FAILED", "inline": true },
                  { "name": "⏱️ Duration", "value": "__DURATION__s", "inline": false },
                  { "name": "🔗 Run", "value": "[Open workflow run](__RUN_URL__)", "inline": false }
                ],
                "footer": { "text": "CatalogoHoy · GitHub Actions" }
              }
            ]
          }
          JSON
          )

          payload=${payload/__REPO__/$REPO}
          payload=${payload/__BRANCH__/$BRANCH}
          payload=${payload/__RUN_URL__/$RUN_URL}
          payload=${payload/__DURATION__/$DURATION}

          curl -sS -H "Content-Type: application/json" -X POST -d "$payload" "$DISCORD_WEBHOOK_URL" || true
