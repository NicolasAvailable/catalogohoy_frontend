    <!-- Fonts: Inter (variable) + IBM Plex Mono — carga NO bloqueante (CWV).

         bloquea el render (con display=swap el texto aparece ya en la fuente de
         sistema y luego cambia). preload adelanta el fetch; noscript de fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
