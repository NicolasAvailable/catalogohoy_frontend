@if (visible()) {
  <div
    (click)="closeSidebar.emit()"
    class="fixed inset-0 bg-slate-900/20 z-40 sm:hidden"
  ></div>
}

<aside
  class="flex flex-col gap-2 h-full w-3/4 sm:w-72 bg-white py-5 border-r border-grey-50 fixed inset-y-0 left-0 z-50 transition-transform duration-300 sm:translate-x-0 sm:static"
  [ngClass]="{ 'translate-x-0': visible(), '-translate-x-full': !visible() }"
>
  <div class="w-full px-5 pb-4 border-b border-grey-50">
    <div class="flex items-center gap-3">
      <ui-icon
        name="https://yvkurjivijnhliofmfmj.supabase.co/storage/v1/object/public/catalogohoy/favicon-c.png"
        styleClass="w-10 h-10 rounded-xl shrink-0 object-cover"
      />
      <div class="flex flex-col min-w-0 flex-1">
        <span class="text-base font-bold text-grey-700 truncate">
          CatalogoHoy
        </span>
        <span class="text-xs text-grey-300 truncate">
          Panel interno
        </span>
      </div>
    </div>
  </div>

  <ul class="flex flex-col gap-1 w-full h-full px-3 mt-2">
    @for (item of navItems; track item.routerLink) {
      <li
        [routerLink]="item.routerLink"
        routerLinkActive="bg-primary-50"
        [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
        class="flex items-center gap-2 w-full px-3 py-2 rounded-md cursor-pointer hover:bg-primary-50 transition-colors duration-100 ease-in-out"
      >
        <ui-icon [name]="item.icon" size="18" styleClass="text-grey-700" />
        <a class="font-base font-semibold text-grey-700 mt-0.5">{{ item.label }}</a>
      </li>
    }
  </ul>
</aside>
