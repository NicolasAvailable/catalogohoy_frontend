    <!-- Auto-recuperación de ChunkLoadError tras un deploy. Si un index.html viejo
         (cacheado) referencia un chunk hasheado que el deploy nuevo ya reemplazó,
         el navegador falla al importar el módulo y el catálogo se ve "caído".
         Escuchamos a nivel window (captura) porque estos fallos de carga de módulo
         no siempre llegan al ErrorHandler de Angular ni al handler del router.
         Recargamos UNA vez (anti-loop 10s) para traer el shell nuevo. -->
    <script>
      (function () {
        var KEY = 'chunk-reload-at';
        var RX = /Failed to fetch dynamically imported module|error loading dynamically imported module|Importing a module script failed|is not a valid JavaScript MIME type|Expected a JavaScript module script but the server responded with|ChunkLoadError|Loading chunk [\w-]+ failed/i;
        function reloadOnce() {
          try {
            var last = Number(sessionStorage.getItem(KEY) || 0);
            if (Date.now() - last < 10000) return;
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (e) {}
          location.reload();
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && t.tagName === 'SCRIPT' && t.src && /\.(?:m?js)(?:\?|$)/.test(t.src)) { reloadOnce(); return; }
          var m = e && (e.message || (e.error && e.error.message));
          if (m && RX.test(String(m))) reloadOnce();
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          var m = r && (r.message || r);
          if (m && RX.test(String(m))) reloadOnce();
        });
      })();
    </script>

    <!-- Meta Pixel: lo gestiona MetaPixelService (libs/catalogohoy/core), único
         dueño del bootstrap de fbq. Cargar aquí un pixel hardcodeado además
         reinicializaba fbq/fbevents.js dos veces (race → ~1/3–2/3 de los
         PageView/eventos del catálogo no salían). No agregar pixels acá. -->

    <!-- Google Analytics 4 — solo storefront público (admin y localhost quedan fuera).
         Los page_view de navegación SPA los cubre la "medición mejorada" de GA4
         (cambios de historial), no hace falta integrar el Router. -->
    <script>
      (function () {
        var GA_ID = 'G-TL9DYGTFED';
        var isAdmin = /^\/admin(\/|$)/.test(window.location.pathname);
        var isLocal = /^(localhost|127\.0\.0\.1)$/.test(window.location.hostname);
        if (!GA_ID || isAdmin || isLocal) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', GA_ID);
      })();
    </script>
