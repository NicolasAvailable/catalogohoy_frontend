<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dashboard | CatalogoHoy</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/png"
      href="https://yvkurjivijnhliofmfmj.supabase.co/storage/v1/object/public/catalogohoy/favicon-c.png"
    />
    <link rel="stylesheet" href="styles/splash-screen.css" />
  </head>
  <body class="overflow-y-auto">
    <splash-screen>
      <img
        id="splash-logo"
        src="https://yvkurjivijnhliofmfmj.supabase.co/storage/v1/object/public/catalogohoy/favicon-c.png"
        alt="Loading"
      />
    </splash-screen>
    <script>
      (function () {
        var isAdmin = /^\/admin(\/|$)/.test(window.location.pathname);
        if (!isAdmin) {
          var cached = localStorage.getItem('splash-logo');
          if (cached) {
            var img = document.getElementById('splash-logo');
            if (img) img.src = cached;
          }
        }
      })();
    </script>
    <app-root></app-root>
  </body>
</html>
