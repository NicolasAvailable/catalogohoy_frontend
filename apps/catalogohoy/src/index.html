<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>CatalogoHoy — Tu catálogo digital</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

    <!-- SEO base (overridden dynamically by Angular + serverless for crawlers) -->
    <meta name="description" content="Crea tu catálogo online y comparte tus productos con tus clientes." />
    <meta property="og:title" content="CatalogoHoy — Tu catálogo digital" />
    <meta property="og:description" content="Crea tu catálogo online y comparte tus productos con tus clientes." />
    <meta property="og:image" content="https://yvkurjivijnhliofmfmj.supabase.co/storage/v1/object/public/catalogohoy/favicon-c.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="CatalogoHoy" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CatalogoHoy — Tu catálogo digital" />
    <meta name="twitter:description" content="Crea tu catálogo online y comparte tus productos con tus clientes." />
    <meta name="twitter:image" content="https://yvkurjivijnhliofmfmj.supabase.co/storage/v1/object/public/catalogohoy/favicon-c.png" />

    <link
      rel="icon"
      type="image/png"
      href="https://yvkurjivijnhliofmfmj.supabase.co/storage/v1/object/public/catalogohoy/favicon-c.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/splash-screen.css" />
  </head>
  <body class="overflow-y-auto">
    <!-- Meta Pixel noscript fallback -->
    <noscript>
      <img height="1" width="1" style="display:none"
        src="https://www.facebook.com/tr?id=2650734015311155&ev=PageView&noscript=1" />
    </noscript>
    <splash-screen>
      <img
        id="splash-logo"
        src="https://yvkurjivijnhliofmfmj.supabase.co/storage/v1/object/public/catalogohoy/favicon-c.png"
        alt="Loading"
      />
    </splash-screen>
    <script>
      (function () {
        var isAdmin = /^\/admin(\/|$)/.test(window.location.pathname);
        if (!isAdmin) {
          var cached = localStorage.getItem('splash-logo');
          if (cached) {
            var img = document.getElementById('splash-logo');
            if (img) img.src = cached;
          }
        }
      })();
    </script>
    <app-root></app-root>
  </body>
</html>
