@if (version.updateAvailable()) {
  <!-- Desktop: card flotante abajo a la izquierda -->
  <div class="update-banner update-banner--card" role="status" aria-live="polite">
    <button
      type="button"
      class="update-banner__close"
      aria-label="Cerrar"
      (click)="version.dismiss()"
    >
      <ui-icon name="x" styleClass="size-4" />
    </button>

    <div class="update-banner__body">
      <div class="update-banner__icon">
        <ui-icon name="refresh-cw" styleClass="size-5" />
      </div>
      <div class="update-banner__text">
        <strong>Hay una nueva versión disponible</strong>
        <p>Recarga para acceder a las últimas mejoras y correcciones.</p>
      </div>
    </div>

    <div class="update-banner__actions">
      <button type="button" class="update-banner__reload" (click)="version.reload()">
        <ui-icon name="refresh-cw" styleClass="size-3.5" />
        Recargar ahora
      </button>
    </div>
  </div>

  <!-- Mobile: barra fija arriba, mismo formato que el banner de vencimiento -->
  <div class="update-bar" role="status" aria-live="polite">
    <div class="update-bar__content">
      <span class="update-bar__text">
        <ui-icon name="refresh-cw" styleClass="size-4 shrink-0" />
        Hay una <strong>nueva versión</strong> disponible
      </span>
      <div class="update-bar__actions">
        <button type="button" class="update-bar__cta" (click)="version.reload()">
          Recargar
        </button>
        <button
          type="button"
          class="update-bar__close"
          aria-label="Cerrar"
          (click)="version.dismiss()"
        >
          <ui-icon name="x" styleClass="size-4" />
        </button>
      </div>
    </div>
  </div>
}
