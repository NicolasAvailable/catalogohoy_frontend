<nav
  class="flex items-center justify-between h-16 w-full py-3 px-4 bg-transparent"
>
  <div class="flex items-center">
    <ui-button
      icon="menu"
      (click)="toggleSidebar.emit()"
      variant="outlined"
      severity="primary"
      styleClass="!border-none !text-grey-700 sm:!hidden"
    />
  </div>
  <div class="flex items-center gap-2">
    <ui-button
      id="button-share"
      (click)="share()"
      icon="share2"
      severity="primary"
      variant="outlined"
      styleClass="!border-none !text-grey-700"
      tooltip="Compartir catálogo"
      tooltipPosition="bottom"
      tooltipStyleClass="text-sm"
    />
    <ui-button
      id="button-qr"
      (click)="generateQR()"
      icon="qr-code"
      severity="primary"
      variant="outlined"
      styleClass="!border-none !text-grey-700"
      tooltip="Generar QR"
      tooltipPosition="bottom"
      tooltipStyleClass="text-sm"
    />
  </div>
  <div class="flex items-center">
    <ui-button
      icon="message-circle-question"
      severity="primary"
      variant="outlined"
      styleClass="!border-none !text-grey-700"
      tooltip="Ayuda"
      tooltipPosition="bottom"
      tooltipStyleClass="text-sm"
    />
    <div
      (click)="profileMenu.menu()?.toggle($event)"
      class="flex items-center gap-2 rounded-lg py-1 px-2 cursor-pointer hover:bg-primary-50"
    >
      <ui-avatar
        [label]="profileStore.profile().name"
        class="leading-none h-auto"
        styleClass="!bg-[#8892F0] !text-lino-500"
      />
      <span
        class="hidden sm:block text-base font-semibold text-grey-700 leading-none h-auto"
        >{{ profileStore.profile().name }}</span
      >
    </div>
    <app-profile-menu #profileMenu></app-profile-menu>
  </div>
</nav>
