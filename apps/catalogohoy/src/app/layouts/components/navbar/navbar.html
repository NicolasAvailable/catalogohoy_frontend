<nav
  class="flex items-center justify-between h-16 w-full py-3 px-4 bg-white border-b border-grey-50"
>
  <div class="flex items-center gap-2">
    <ui-button
      icon="menu"
      (click)="toggleSidebar.emit()"
      variant="outlined"
      severity="primary"
      styleClass="!border-none !text-grey-700 sm:!hidden"
    />
    <a routerLink="/admin" class="flex items-center cursor-pointer">
      <ui-icon
        name="https://yvkurjivijnhliofmfmj.supabase.co/storage/v1/object/public/catalogohoy/logo.svg"
        styleClass="h-10"
      />
      <span class="text-xl font-semibold text-grey-700 leading-none pt-1">
        CatalogoHoy
      </span>
    </a>
  </div>
  <div class="flex items-center gap-1">
    <ui-button
      id="button-share"
      (click)="share()"
      icon="share2"
      severity="primary"
      variant="outlined"
      styleClass="!border-none !text-grey-700"
      tooltip="Compartir catálogo"
      tooltipPosition="bottom"
      tooltipStyleClass="text-sm"
    />
    <ui-button
      id="button-qr"
      (click)="generateQR()"
      icon="qr-code"
      severity="primary"
      variant="outlined"
      styleClass="!border-none !text-grey-700"
      tooltip="Generar QR"
      tooltipPosition="bottom"
      tooltipStyleClass="text-sm"
    />
    @if (planStore.currentPlan(); as plan) {
    <a
      routerLink="/admin/plans"
      class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-primary-50 hover:bg-primary-100 transition-colors cursor-pointer mr-1"
    >
      <ui-icon name="crown" size="16" styleClass="text-primary-500" />
      <span class="text-sm font-semibold text-primary-600"
        >{{ plan.name }}</span
      >
    </a>
    }
    <ui-button
      icon="message-circle-question"
      severity="primary"
      variant="outlined"
      styleClass="!border-none !text-grey-700"
      tooltip="Ayuda"
      tooltipPosition="bottom"
      tooltipStyleClass="text-sm"
    />
    <div
      (click)="profileMenu.menu()?.toggle($event)"
      class="flex items-center gap-2 rounded-lg py-1 px-2 cursor-pointer hover:bg-primary-50"
    >
      <ui-avatar
        [label]="profileStore.profile().name"
        class="leading-none h-auto"
        styleClass="!bg-[#8892F0] !text-lino-500"
      />
      <span
        class="hidden sm:block text-base font-semibold text-grey-700 leading-none h-auto"
        >{{ profileStore.profile().name }}</span
      >
    </div>
    <app-profile-menu #profileMenu></app-profile-menu>
  </div>
</nav>
