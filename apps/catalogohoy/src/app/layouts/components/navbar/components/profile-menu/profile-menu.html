<ui-menu #profileMenu [items]="[]" styleClass="profile-menu">
  <ng-template #end>
    <div class="pm-list">
      <a routerLink="plans" class="pm-item" (click)="close()">
        <div class="pm-item__icon pm-item__icon--plans">
          <ui-icon name="crown" size="16" />
        </div>
        <div class="pm-item__text">
          <span class="pm-item__label">Planes</span>
          <span class="pm-item__sub">Gestiona tu suscripción</span>
        </div>
        <ui-icon name="chevron-right" size="14" styleClass="pm-item__chevron" />
      </a>
      <div class="pm-divider"></div>
      <a routerLink="profile" class="pm-item" (click)="close()">
        <div class="pm-item__icon pm-item__icon--profile">
          <ui-icon name="user" size="16" />
        </div>
        <div class="pm-item__text">
          <span class="pm-item__label">Mi Cuenta</span>
          <span class="pm-item__sub">Perfil y configuración</span>
        </div>
        <ui-icon name="chevron-right" size="14" styleClass="pm-item__chevron" />
      </a>
    </div>
  </ng-template>
</ui-menu>
