<div class="pos-root">
  <!-- ── Barra lateral (rail solo-iconos, estilo TiendaNube) ── -->
  <nav class="pos-rail">
    <a class="rail-logo" [class.has-img]="catalogLogo()" routerLink="/pos" [pTooltip]="'Inicio' | transloco" tooltipPosition="right">
      @if (catalogLogo()) {
        <img [src]="catalogLogo()" [alt]="catalogName()" />
      } @else {
        <ui-icon name="store" styleClass="size-7" />
      }
    </a>

    <div class="rail-items">
      @for (item of nav; track item.link) {
        <a
          class="rail-item"
          [routerLink]="item.link"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          [pTooltip]="item.label | transloco"
          tooltipPosition="right"
        >
          <ui-icon [name]="item.icon" styleClass="size-6" />
        </a>
      }
    </div>

    <a
      class="rail-item rail-gear"
      routerLink="/pos/configuracion"
      routerLinkActive="active"
      [pTooltip]="'Configuración' | transloco"
      tooltipPosition="right"
    >
      <ui-icon name="settings" styleClass="size-6" />
    </a>

    <!-- Último: salir del POS (cierra la ventana / vuelve al panel del admin) -->
    <button
      type="button"
      class="rail-item rail-exit"
      (click)="exitPos()"
      [pTooltip]="'Volver al panel' | transloco"
      tooltipPosition="right"
    >
      <ui-icon name="log-out" styleClass="size-6" />
    </button>
  </nav>

  <!-- ── Contenido ── -->
  <div class="pos-main">
    <header class="pos-topbar">
      <div class="tb-right">
        <button type="button" class="tb-icon" [pTooltip]="'Notificaciones' | transloco" tooltipPosition="bottom">
          <ui-icon name="bell" styleClass="size-6" />
        </button>
        <button type="button" class="tb-icon" [pTooltip]="'Ayuda' | transloco" tooltipPosition="bottom">
          <ui-icon name="circle-help" styleClass="size-6" />
        </button>
        <span class="tb-sep"></span>
        <div class="tb-user">
          <span class="tb-avatar"><ui-icon name="user" styleClass="size-5" /></span>
          <div class="tb-userinfo">
            <span class="tb-name">{{ catalogName() }}</span>
            @if (caja.hasOpenSession()) {
              <a class="tb-badge open" routerLink="/pos/caja">
                <ui-icon name="wallet" styleClass="size-4" />
                {{ 'Caja abierta' | transloco }}
              </a>
            } @else if (caja.loaded()) {
              <a class="tb-badge" routerLink="/pos/caja">
                <ui-icon name="wallet" styleClass="size-4" />
                {{ 'Sin caja' | transloco }}
              </a>
            }
          </div>
        </div>
        <button type="button" class="tb-exit" (click)="exitPos()" [pTooltip]="'Salir' | transloco" tooltipPosition="bottom">
          <ui-icon name="log-out" styleClass="size-6" />
        </button>
      </div>
    </header>

    <div class="pos-content">
      <router-outlet />
    </div>
  </div>
</div>
