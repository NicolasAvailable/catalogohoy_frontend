<ui-card styleClass="h-28! mb-4">
  <section class="size-full grid grid-cols-[1fr_auto] justify-between items-center">
    <div class="h-full w-full relative">
      <div class="flex items-center gap-4 absolute inset-0">
        <figure
          class="w-16 h-16 bg-secondary-100 rounded-full flex items-center justify-center shrink-0"
          [ngClass]="{ 'bg-secondary-500': uploader().is.completed }"
        >
          <ui-icon name="file" styleClass="w-8 h-8 text-white" />
        </figure>

        <section class="w-9/12 flex flex-col gap-1 justify-center">
          <h3 class="font-sans! font-semibold text-grey-500 truncate">
            {{ uploader().file.name }}
          </h3>

          <data class="text-xs font-semibold text-grey-300 mb-1" [value]="uploader().file.size">
            {{ uploader().file.size }} {{ 'GLOBAL.KB' | translate }}
          </data>

          @if(!uploader().is.idle) {
          <ui-progress-bar [value]="uploader().progress" [hiddenCompleted]="true" />
          }
        </section>
      </div>
    </div>

    @if(removable() && !uploader().is.uploading) {
    <div (click)="remove.emit()" tabindex="0" class="cursor-pointer">
      <ui-icon name="trash" styleClass="size-6" />
    </div>
    }
  </section>
</ui-card>
