<section class="size-full">
  <div class="flex flex-col items-center gap-6 mx-auto" [class]="styleClass()">
    <ui-icon [name]="icon()" styleClass="text-grey-100 h-40 w-40" />
    <h2 class="text-xl font-bold">{{ label() | translate }}</h2>
    <p class="text-gray-600 text-center max-w-2xl px-6">
      {{ description() | translate }}
    </p>
    @if(cta()){
    <ui-button
      (click)="ctaClick.emit()"
      [routerLink]="ctaLink() ? ctaLink() : null"
      [label]="cta() | translate"
      icon="circle-plus"
      severity="secondary"
      size="large"
      class="w-fit mx-auto xs:mx-0 mt-4 xs:mt-0"
    />
    }
  </div>
</section>
