<section
  class="container flex flex-col flex-1 max-w-5xl mx-auto px-1 overflow-hidden"
>
  <header class="flex justify-between items-center py-4">
    <h1 class="text-4xl font-bold">Crear producto</h1>
    <div class="flex gap-3 items-center">
      <ui-button
        routerLink=".."
        label="Cancelar"
        variant="outlined"
        severity="contrast"
      />
      <ui-button
        (click)="create()"
        [disabled]="form.invalid"
        label="Guardar cambios"
      />
    </div>
  </header>
  <form
    [formGroup]="form"
    class="flex flex-col gap-3 flex-1 overflow-y-auto min-h-0 pb-4"
  >
    <ui-card>
      <div class="flex flex-col gap-4">
        <h2 class="text-xl font-bold">Nombre y Descripción</h2>
        <div class="flex flex-col gap-2">
          <label class="text-base text-grey-100" for="name">Nombre</label>
          <ui-input-text
            formControlName="name"
            placeholder="Franela de manga corta"
            inputId="name"
          />
        </div>

        <div class="flex flex-col gap-2">
          <div class="flex items-center gap-3">
            <label class="text-base text-grey-100" for="description"
              >Descripción</label
            >
            <span class="text-sm text-grey-100">(Opcional)</span>
          </div>

          <ui-textarea
            formControlName="description"
            placeholder="Es una franela de manga corta perfecta para..."
            textareaId="description"
            [rows]="5"
          />
        </div>
      </div>
    </ui-card>
    <ui-card>
      <div class="flex flex-col gap-4">
        <h2 class="text-xl font-bold">Fotos y multimedia</h2>
        <div class="flex flex-col gap-4">
          <ui-uploader
            (valueChange)="setPhoto($event)"
            [accept]="'image/webp, image/png, image/jpeg'"
            [max]="{ mb: 40 }"
          >
            <ng-template #picker let-pick="pick">
              <button
                type="button"
                (click)="pick()"
                class="flex flex-col items-center justify-center w-full border-2 border-dashed border-primary-500 rounded-xl py-10 bg-primary-50/10 cursor-pointer hover:bg-primary-50/20 transition-colors"
              >
                <ui-icon
                  name="circle-plus"
                  size="24"
                  styleClass="text-primary-500 mb-2"
                />
                <p class="text-primary-500 font-bold text-base">
                  Arrastrá y soltá, o subí fotos del producto
                </p>
              </button>
            </ng-template>
          </ui-uploader>

          <div class="flex items-center gap-2 text-grey-300 text-sm">
            <ui-icon name="book-image" size="18" />
            <p>
              Tamaño mínimo recomendado: 1024px / Formatos recomendados: WEBP,
              PNG o JPEG
            </p>
          </div>

          @if (photos().length > 0) {
          <div class="grid grid-cols-3 gap-4 mt-4">
            @for (photo of photos(); track photo) {
            <div
              class="relative max-w-56 group aspect-square rounded-xl overflow-hidden border border-grey-200"
            >
              <img
                [src]="photo"
                alt="Foto del producto"
                class="w-full h-full object-cover"
              />
              <button
                type="button"
                (click)="removePhoto(photo)"
                class="absolute top-2 right-2 p-1 bg-white/80 rounded-sm cursor-pointer hover:bg-white text-grey-500 transition-colors opacity-0 group-hover:opacity-100"
              >
                <ui-icon name="trash" size="18" />
              </button>
            </div>
            }
          </div>
          }
        </div>
      </div>
    </ui-card>
    <ui-card>
      <div class="flex flex-col gap-4">
        <h2 class="text-xl font-bold">Precios</h2>
        <div class="grid grid-cols-2 gap-4">
          <div class="flex flex-col gap-2">
            <label class="text-base text-grey-100" for="price"
              >Precio de venta</label
            >
            <ui-input-number
              formControlName="price"
              mode="currency"
              currency="USD"
              locale="en-US"
              [showButtons]="false"
              placeholder="$ 0.00"
              inputId="price"
            />
          </div>
          <div class="flex flex-col gap-2">
            <label class="text-base text-grey-100" for="pricePromotional"
              >Precio promocional</label
            >
            <ui-input-number
              formControlName="pricePromotional"
              mode="currency"
              currency="USD"
              locale="en-US"
              [showButtons]="false"
              placeholder="$ 0.00"
              inputId="pricePromotional"
            />
          </div>
        </div>
      </div>
    </ui-card>
    <ui-card>
      <div class="flex flex-col gap-4">
        <h2 class="text-xl font-bold">Inventario</h2>

        <div class="flex flex-col gap-3">
          <span class="text-base text-grey-100 font-medium">Stock</span>

          <div class="flex flex-col gap-3">
            <!-- Infinito Option -->
            <div
              [class]="'flex items-start gap-3 p-4 border rounded-lg transition-all cursor-pointer ' + 
                (form.get('stock')?.value === null 
                  ? 'border-primary-500 bg-primary-50/10' 
                  : 'border-grey-200 hover:border-primary-300')"
            >
              <ui-radio-button
                formControlName="stock"
                inputId="stock-unlimited"
                name="stock"
                [optionValue]="null"
              />
              <label for="stock-unlimited" class="cursor-pointer flex-1 pt-0.5">
                Infinito
              </label>
            </div>

            <!-- Limitado Option -->
            <div
              [class]="'flex flex-col gap-3 p-4 border rounded-lg transition-all ' + 
                (form.get('stock')?.value !== null 
                  ? 'border-primary-500 bg-primary-50/10' 
                  : 'border-grey-200 hover:border-primary-300')"
            >
              <div class="flex items-start gap-3 cursor-pointer">
                <ui-radio-button
                  formControlName="stock"
                  inputId="stock-limited"
                  name="stock"
                  [optionValue]="1"
                />
                <label for="stock-limited" class="cursor-pointer flex-1 pt-0.5">
                  Limitado
                </label>
              </div>

              @if (form.get('stock')?.value !== null) {
              <div class="flex flex-col gap-2 pl-8">
                <label class="text-sm text-grey-100" for="stockQuantity">
                  Cantidad
                </label>
                <ui-input-number
                  formControlName="stock"
                  inputId="stockQuantity"
                  [min]="0"
                  [showButtons]="true"
                  placeholder="0"
                />
              </div>
              }
            </div>
          </div>
        </div>
      </div>
    </ui-card>
  </form>
</section>
