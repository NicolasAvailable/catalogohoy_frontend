<section
  class="container flex flex-col flex-1 max-w-5xl mx-auto px-1 overflow-hidden"
>
  <header class="flex justify-between items-center py-4">
    <h1 class="text-4xl font-bold">Crear producto</h1>
    <div class="flex gap-3 items-center">
      <ui-button
        routerLink=".."
        label="Cancelar"
        variant="outlined"
        severity="contrast"
      />
      <ui-button label="Guardar cambios" />
    </div>
  </header>
  <form
    [formGroup]="form"
    class="flex flex-col gap-3 flex-1 overflow-y-auto min-h-0 pb-4"
  >
    <ui-card>
      <div class="flex flex-col gap-4">
        <h2 class="text-xl font-bold">Nombre y Descripción</h2>
        <div class="flex flex-col gap-2">
          <label class="text-base text-grey-100" for="name">Nombre</label>
          <ui-input-text
            formControlName="name"
            placeholder="Franela de manga corta"
            inputId="name"
          />
        </div>

        <div class="flex flex-col gap-2">
          <div class="flex items-center gap-3">
            <label class="text-base text-grey-100" for="description"
              >Descripción</label
            >
            <span class="text-sm text-grey-100">(Opcional)</span>
          </div>

          <ui-textarea
            formControlName="description"
            placeholder="Es una franela de manga corta perfecta para..."
            textareaId="description"
            [rows]="5"
          />
        </div>
      </div>
    </ui-card>
    <ui-card>
      <div class="flex flex-col gap-4">
        <h2 class="text-xl font-bold">Fotos y multimedia</h2>
        <div class="flex flex-col gap-4">
          <div
            class="flex flex-col items-center justify-center border-2 border-dashed border-primary-500 rounded-xl py-10 bg-primary-50/10 cursor-pointer hover:bg-primary-50/20 transition-colors"
          >
            <ui-icon
              name="circle-plus"
              size="24"
              styleClass="text-primary-500 mb-2"
            />
            <p class="text-primary-500 font-bold text-base">
              Arrastrá y soltá, o subí fotos del producto
            </p>
          </div>

          <div class="flex items-center gap-2 text-grey-300 text-sm">
            <ui-icon name="book-image" size="18" />
            <p>
              Tamaño mínimo recomendado: 1024px / Formatos recomendados: WEBP,
              PNG o JPEG
            </p>
          </div>
        </div>
      </div>
    </ui-card>
    <ui-card>
      <div class="flex flex-col gap-4">
        <h2 class="text-xl font-bold">Precios</h2>
        <div class="grid grid-cols-2 gap-4">
          <div class="flex flex-col gap-2">
            <label class="text-base text-grey-100" for="price"
              >Precio de venta</label
            >
            <ui-input-number
              formControlName="price"
              mode="currency"
              currency="USD"
              locale="en-US"
              [showButtons]="false"
              placeholder="$ 0.00"
              inputId="price"
            />
          </div>
          <div class="flex flex-col gap-2">
            <label class="text-base text-grey-100" for="price_promotional"
              >Precio promocional</label
            >
            <ui-input-number
              formControlName="price_promotional"
              mode="currency"
              currency="USD"
              locale="en-US"
              [showButtons]="false"
              placeholder="$ 0.00"
              inputId="price_promotional"
            />
          </div>
        </div>
      </div>
    </ui-card>
  </form>
</section>
