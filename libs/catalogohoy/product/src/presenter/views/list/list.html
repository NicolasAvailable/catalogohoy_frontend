<section
  class="container flex flex-col flex-1 max-w-5xl mx-auto px-1 overflow-hidden"
>
  <header class="flex justify-between items-center py-4">
    <h1 class="text-4xl font-bold">Productos</h1>
    <div class="flex gap-3 items-center">
      <span>200 productos</span>
      <ui-button
        label="Importar"
        icon="arrow-down-to-line"
        variant="outlined"
        severity="contrast"
      />
      <ui-button
        routerLink="create"
        label="Crear producto"
        icon="circle-plus"
      />
    </div>
  </header>
  <form [formGroup]="searchForm" class="flex py-2">
    <ui-input-text
      formControlName="search"
      placeholder="Buscar..."
      class="w-full"
      styleClass="w-full"
    />
  </form>
  <section class="flex-1 flex flex-col gap-4 overflow-y-auto h-full">
    <ui-table
      class="flex-1"
      [items]="productStore.productList().products"
      [scrollable]="true"
      scrollHeight="flex"
    >
      <ng-template #header>
        <div class="flex justify-between py-3 px-6">
          <h4 class="flex-3 text-base font-semibold">Producto</h4>
          <h4 class="flex-1 text-base font-semibold">Stock</h4>
          <h4 class="flex-1 text-base font-semibold">Precio</h4>
          <h4 class="flex-1 text-base font-semibold">Promocional</h4>
          <h4 class="flex-1 text-base font-semibold">Acciones</h4>
        </div>
      </ng-template>
      <ng-template #body let-item>
        <ui-card styleClass="mx-6">
          <section class="flex justify-between">
            <div class="flex gap-2 flex-3 overflow-hidden">
              <ui-icon
                [name]="item.photos.length > 0 ? item.photos[0] : 'https://yvkurjivijnhliofmfmj.supabase.co/storage/v1/object/public/catalogohoy/logo.svg'"
                styleClass="w-24 rounded-sm"
              />
              <h2 class="ml-4 text-lg line-clamp-3">{{item.name}}</h2>
            </div>
            <div class="flex-1 flex">
              <span>{{item.stock}}</span>
            </div>
            <div class="flex-1 flex">
              <span>{{item.price}}</span>
            </div>
            <div class="flex-1 flex">
              <span>{{item.pricePromotional}}</span>
            </div>
            <div class="flex-1 flex gap-1">
              <ui-button
                icon="eye"
                variant="outlined"
                severity="contrast"
                size="small"
              />
              <ui-button
                icon="share2"
                variant="outlined"
                severity="contrast"
                size="small"
              />
              <ui-button
                icon="ellipsis-vertical"
                variant="outlined"
                severity="contrast"
                size="small"
              />
            </div>
          </section>
        </ui-card>
      </ng-template>
    </ui-table>
  </section>
</section>
