<section
  class="container flex flex-col gap-6 flex-1 max-w-5xl mx-auto px-1 overflow-hidden"
>
  <header class="flex justify-between items-center">
    <div class="flex items-center gap-4">
      <h1 class="text-3xl font-bold">Editar categoría</h1>
    </div>
    <div class="flex gap-3">
      <ui-button
        routerLink="/admin/categories"
        label="Cancelar"
        variant="outlined"
        severity="contrast"
        [disabled]="isSaving()"
      />
      <ui-button label="Guardar cambios" (click)="onSave()" [disabled]="form.invalid || isSaving()" />
    </div>
  </header>

  <ui-card>
    <form [formGroup]="form" class="flex flex-col gap-6">
      <!-- Info Card -->
      <div class="flex flex-col gap-6">
        <div class="flex flex-col gap-2">
          <label for="name" class="text-base text-grey-100">Nombre</label>
          <ui-input-text formControlName="name" inputId="name" class="w-full" />
        </div>

        <div class="flex flex-col gap-2">
          <div class="flex items-center gap-2 justify-between">
            <div class="flex items-center gap-2">
              <label for="description" class="text-base text-grey-100"
                >Descripción (opcional)</label
              >
            </div>
            <span class="text-xs text-gray-400"
              >{{description.value().length}}/140</span
            >
          </div>
          <ui-textarea
            #description
            formControlName="description"
            textareaId="description"
            class="w-full"
            [rows]="4"
            placeholder="Contale a tus clientes lo que van a encontrar en esta categoría."
          />
        </div>
      </div>
    </form>
  </ui-card>

  <ui-card>
    <form [formGroup]="form" class="flex gap-6">
      <h2 class="text-xl font-bold mb-4">Visibilidad</h2>

      <div class="flex items-center gap-2">
        <ui-checkbox
          formControlName="isVisible"
          label="Mostrar esta categoría en la tienda"
        />
      </div>
    </form>
  </ui-card>
</section>
