@if (isOverlay()) {
<div class="overlay-backdrop" [class.overlay-hidden]="hidden()" (click)="close.emit()">
  <div class="overlay-container" (click)="$event.stopPropagation()">
    <div class="overlay-header">
      <div class="overlay-title">
        <ui-icon name="monitor-smartphone" styleClass="size-5"></ui-icon>
        <span>{{ 'Vista en Tiempo Real' | transloco }}</span>
      </div>
      <button class="overlay-close" (click)="close.emit()">
        <ui-icon name="x" styleClass="size-5"></ui-icon>
      </button>
    </div>
    <div class="phone-bezel">
      <div class="phone-notch"></div>
      <iframe
        #previewIframe
        [src]="iframeUrl()"
        (load)="onIframeLoad()"
        class="phone-screen"
        [title]="'Vista previa del catálogo' | transloco"
      ></iframe>
    </div>
  </div>
</div>
} @else if (device() === 'desktop') {
<div class="mockup-wrapper">
  <div class="desktop-frame">
    <div class="desktop-bar">
      <i></i><i></i><i></i>
      <span class="desktop-url">{{ displayUrl() }}</span>
    </div>
    <div class="desktop-viewport">
      <iframe
        #previewIframe
        [src]="iframeUrl()"
        (load)="onIframeLoad()"
        class="desktop-screen"
        [title]="'Vista previa del catálogo' | transloco"
      ></iframe>
    </div>
  </div>
</div>
} @else if (phone(); as m) {
<div class="model-wrap" #modelWrap>
  @if (frame(); as f) {
  <div
    class="model-phone"
    [class.model-phone--home]="m.cutout === 'home'"
    [style.padding]="f.top + 'px ' + f.side + 'px'"
    [style.borderRadius.px]="f.outerR"
  >
    <div class="model-screen" [style.width.px]="f.sw" [style.height.px]="f.sh" [style.borderRadius.px]="f.r">
      <iframe
        #previewIframe
        [src]="iframeUrl()"
        (load)="onIframeLoad()"
        class="model-iframe"
        [style.width.px]="m.w"
        [style.height.px]="m.h"
        [style.zoom]="f.s"
        [title]="'Vista previa del catálogo' | transloco"
      ></iframe>
      @switch (m.cutout) {
        @case ('island') { <span class="model-island"></span> }
        @case ('notch') { <span class="model-notch"></span> }
        @case ('punch') { <span class="model-punch"></span> }
      }
    </div>
    @if (m.cutout === 'home') { <span class="model-speaker"></span><span class="model-home"></span> }
  </div>
  }
</div>
} @else {
<div class="mockup-wrapper">
  <div class="phone-bezel">
    <div class="phone-notch"></div>
    <iframe
      #previewIframe
      [src]="iframeUrl()"
      (load)="onIframeLoad()"
      class="phone-screen"
      [title]="'Vista previa del catálogo' | transloco"
    ></iframe>
  </div>
</div>
}
