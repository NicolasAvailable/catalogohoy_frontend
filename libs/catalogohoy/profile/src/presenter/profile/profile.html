<section class="container flex flex-col gap-4 max-w-2xl mx-auto">
  <h1 class="text-4xl font-bold">Perfil</h1>
  <ui-card>
    <form [formGroup]="profileForm" class="flex flex-col gap-3">
      <h1 class="text-2xl font-bold">Datos personales</h1>

      <div class="flex flex-col gap-1.5">
        <label for="name" class="text-sm font-medium text-grey-700"
          >Nombre</label
        >
        <ui-input-text formControlName="name" inputId="name"></ui-input-text>
        <ui-input-message
          [control]="profileForm.get('name')"
          error="required"
          text="El campo es obligatorio"
        />
        <ui-input-message
          [control]="profileForm.get('name')"
          error="whitespace"
          text="No puede contener espacios en blanco"
        />
        <ui-input-message
          [control]="profileForm.get('name')"
          error="minlength"
          text="Debe tener mínimo 4 caracteres"
        />
      </div>
      <div class="flex flex-col gap-1.5">
        <label for="email" class="text-sm font-medium text-grey-700"
          >E-mail</label
        >
        <ui-input-text formControlName="email" inputId="email"></ui-input-text>
      </div>

      <div class="flex gap-3 justify-end w-full mt-4">
        <ui-button
          (click)="updateName()"
          [disabled]="profileForm.invalid"
          label="Guardar"
          severity="primary"
        ></ui-button>
      </div>
    </form>
  </ui-card>

  <ui-accordion [items]="items()" [contentStyleClass]="'mb-8!'">
    @for(item of items(); track item.ref) {

    <ng-template [accordionHeader]="item.ref" let-item="item">
      <div class="flex items-center gap-6">
        <span class="text-2xl font-bold">{{ item.label }}</span>
      </div>
    </ng-template>

    } @for(item of items(); track item.ref) {

    <ng-template [accordionPanel]="item.ref" let-item="item">
      <form [formGroup]="passwordForm" class="flex flex-col gap-2 p-6">
        <div class="flex flex-col gap-1.5">
          <label for="password" class="text-sm font-medium text-grey-700"
            >Nueva contraseña</label
          >
          <ui-input-password
            [feedback]="false"
            formControlName="password"
            inputId="password"
          />
          <ui-input-message
            [control]="passwordForm.get('password')"
            error="required"
            text="El campo es obligatorio"
          />
          <ui-input-message
            [control]="passwordForm.get('password')"
            error="whitespace"
            text="No puede contener espacios en blanco"
          />
          <ui-input-message
            [control]="passwordForm.get('password')"
            error="minlength"
            text="Debe tener mínimo 6 caracteres"
          />
        </div>
        <div class="flex flex-col gap-1.5">
          <label
            for="passwordConfirmed"
            class="text-sm font-medium text-grey-700"
            >Confirmar contraseña</label
          >
          <ui-input-password
            [feedback]="false"
            formControlName="passwordConfirmed"
            inputId="passwordConfirmed"
          />
          <ui-input-message
            [control]="passwordForm.get('passwordConfirmed')"
            error="required"
            text="El campo es obligatorio"
          />
          <ui-input-message
            [control]="passwordForm.get('passwordConfirmed')"
            error="whitespace"
            text="No puede contener espacios en blanco"
          />
          <ui-input-message
            [control]="passwordForm.get('passwordConfirmed')"
            error="minlength"
            text="Debe tener mínimo 6 caracteres"
          />
          <ui-input-message
            [control]="passwordForm"
            error="confirmPassword"
            text="Las contraseñas no coinciden"
          />
        </div>
        <div class="flex gap-3 justify-end w-full mt-4">
          <ui-button
            (click)="updatePassword()"
            [disabled]="passwordForm.invalid"
            label="Guardar"
            severity="primary"
          ></ui-button>
        </div>
      </form>
    </ng-template>
    }
  </ui-accordion>
</section>
