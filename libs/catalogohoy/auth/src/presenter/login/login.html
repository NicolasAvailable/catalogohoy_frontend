<!-- component -->
<div class="bg-gray-100 flex justify-center items-center h-screen">
  <!-- Left: Image -->
  <div class="w-1/2 h-screen hidden lg:block">
    <img
      src="https://placehold.co/800x/667fff/ffffff.png?text=Your+Image&font=Montserrat"
      alt="Placeholder Image"
      class="object-cover w-full h-full"
    />
  </div>
  <!-- Right: Login Form -->
  <div class="lg:p-36 md:p-52 sm:20 p-8 w-full lg:w-1/2">
    <h1 class="text-2xl font-semibold mb-4">Login</h1>
    <form [formGroup]="form">
      <!-- Username Input -->
      <div class="mb-4">
        <label for="email" class="block text-gray-600">Correo</label>
        <ui-input-text formControlName="email" name="email" />
      </div>
      <!-- Password Input -->
      <div class="mb-4">
        <label for="password" class="block text-gray-600">Contraseña</label>
        <ui-input-password
          formControlName="password"
          [feedback]="false"
          name="password"
        />
      </div>
      <!-- Remember Me Checkbox -->

      <!-- Login Button -->
      <ui-button (click)="send()" label="Login" severity="primary" />
    </form>
    <!-- Sign up  Link -->
    <div class="mt-6 text-blue-500 text-center">
      <a routerLink="/signup" class="hover:underline">Sign up Here</a>
    </div>
  </div>
</div>
