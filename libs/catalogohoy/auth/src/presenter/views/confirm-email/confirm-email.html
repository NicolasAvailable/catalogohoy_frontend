<div class="flex flex-col items-center justify-center gap-4 text-center py-8">
  @if (state() === 'loading') {
  <div
    class="w-10 h-10 rounded-full border-2 border-primary-500 border-t-transparent animate-spin"
  ></div>
  <p class="text-grey-600">{{ message() }}</p>
  } @else {
  <p class="text-lg font-semibold text-grey-800">{{ message() }}</p>
  <ui-button
    label="Ir a iniciar sesión"
    [fluid]="false"
    (click)="goToLogin()"
  />
  }
</div>
