<div class="flex justify-center items-center h-screen bg-lino-500 overflow-hidden">

  <!-- ── Form panel ── -->
  <div class="relative flex flex-col justify-center gap-6 w-full lg:w-1/2 h-full p-8 sm:p-20 md:p-44 lg:p-10 lg:items-center lg:bg-[#eceefb]">

    <!-- Logo -->
    <ui-icon
      name="https://yvkurjivijnhliofmfmj.supabase.co/storage/v1/object/public/catalogohoy/logo.svg"
      styleClass="h-14 lg:h-11 rounded-lg"
      class="flex justify-center sm:justify-start lg:absolute lg:top-8 lg:left-8"
    />

    <!-- Card (desktop only) -->
    <div class="flex flex-col gap-6 w-full lg:max-w-md lg:bg-white lg:rounded-3xl lg:p-10">

    <div>
      <h1 class="text-3xl sm:text-4xl lg:text-3xl font-semibold text-grey-700">Ingresa a tu cuenta</h1>
      <p class="text-base text-grey-400 mt-1">Accede para gestionar tu catálogo.</p>
    </div>

    <!-- Google error banner -->
    @if (googleError()) {
      <div class="flex items-start gap-2.5 px-4 py-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-base">
        <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <span>{{ googleError() }}</span>
      </div>
    }

    <!-- Form -->
    <form [formGroup]="form" (keyup.enter)="send()">
      <div class="mb-4">
        <label class="block font-medium text-sm text-grey-400 mb-1">Email</label>
        <ui-input-text size="large" formControlName="email" placeholder="tu@correo.com" />
        <ui-input-message [control]="form.get('email')" error="required" text="El campo es obligatorio" />
        <ui-input-message [control]="form.get('email')" error="whitespace" text="No puede contener espacios en blanco" />
        <ui-input-message [control]="form.get('email')" error="email" text="El formato no es válido" />
      </div>

      <div class="mb-2">
        <label class="block font-medium text-sm text-grey-400 mb-1">Contraseña</label>
        <ui-input-password size="large" [feedback]="false" formControlName="password" placeholder="*********" />
        <ui-input-message [control]="form.get('password')" error="required" text="El campo es obligatorio" />
        <ui-input-message [control]="form.get('password')" error="minlength" text="Debe tener mínimo 6 caracteres" />
      </div>

      <a routerLink="/forgot-password" class="inline-block text-base font-semibold text-blue-500 mb-5">
        ¿Olvidaste tu contraseña?
      </a>

      <ui-button
        (click)="send()"
        [disabled]="form.invalid || loaderStore.isEnable() || isGoogleLoading()"
        label="Iniciar Sesión"
        severity="primary"
        styleClass="!py-4 !text-base"
      />
    </form>

    <!-- Divider -->
    <div class="flex items-center gap-3">
      <div class="flex-1 h-px bg-grey-200"></div>
      <span class="text-xs text-grey-400 font-medium">o</span>
      <div class="flex-1 h-px bg-grey-200"></div>
    </div>

    <!-- Google button -->
    <button
      type="button"
      (click)="loginWithGoogle()"
      [disabled]="isGoogleLoading() || loaderStore.isEnable()"
      class="flex items-center justify-center gap-3 w-full px-5 py-4 rounded-xl border border-grey-200 bg-white hover:bg-grey-50 transition-all duration-150 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed font-semibold text-grey-700 text-base"
    >
      @if (isGoogleLoading()) {
        <ui-icon name="loader-circle" styleClass="w-6 h-6 animate-spin text-grey-400" />
        Conectando con Google...
      } @else {
        <svg class="w-6 h-6 shrink-0" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continuar con Google
      }
    </button>

    <div class="flex justify-center gap-1 text-base text-center">
      <p class="font-semibold text-grey-400">¿No tienes una cuenta?</p>
      <a routerLink="/signup" class="font-semibold text-blue-500">Regístrate aquí</a>
    </div>

    </div>
    <!-- /Card -->
  </div>

  <!-- ── Side image ── -->
  <div class="w-1/2 h-screen hidden lg:block">
    <picture>
      <source
        srcset="https://yvkurjivijnhliofmfmj.supabase.co/storage/v1/object/public/catalogohoy/landing-hero/hero-2x.avif"
        type="image/avif"
      />
      <img
        src="https://yvkurjivijnhliofmfmj.supabase.co/storage/v1/object/public/catalogohoy/landing-hero/hero-2x.webp"
        alt="Empieza a vender hoy con CatalogoHoy"
        class="object-cover w-full h-full"
        fetchpriority="high"
      />
    </picture>
  </div>
</div>
