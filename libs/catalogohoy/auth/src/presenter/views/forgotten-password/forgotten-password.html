<section
  class="flex justify-center items-center h-screen bg-lino-500 lg:bg-[#eceefb] overflow-hidden"
>
  <div
    class="flex flex-col items-center justify-center w-full px-10 py-8 md:h-screen lg:py-0"
  >
    <div
      class="w-full p-6 rounded-lg lg:rounded-3xl border border-lino-200 lg:border-transparent shadow lg:shadow-none bg-lino-400 lg:bg-white md:mt-0 sm:max-w-md sm:p-8"
    >
      <h2
        class="mb-1 text-xl font-bold leading-tight tracking-tight text-grey-700 md:text-2xl"
      >
        {{ 'Recuperar contraseña' | transloco }}
      </h2>
      <form
        (keyup.enter)="send()"
        [formGroup]="form"
        class="mt-4 space-y-4 lg:mt-5 md:space-y-5"
      >
        <div>
          <label
            for="email"
            class="block mb-2 text-sm font-medium text-grey-400"
            >{{ 'Tu correo electrónico' | transloco }}</label
          >
          <ui-input-text
            formControlName="email"
            [placeholder]="'manuel@catalogohoy.com' | transloco"
            name="email"
          />
          <ui-input-message
            [control]="form.get('email')"
            error="required"
            [text]="'El campo es obligatorio' | transloco"
          />
          <ui-input-message
            [control]="form.get('email')"
            error="whitespace"
            [text]="'No puede contener espacios en blanco' | transloco"
          />
          <ui-input-message
            [control]="form.get('email')"
            error="email"
            [text]="'El formato no es válido' | transloco"
          />
        </div>

        <div class="flex flex-col gap-2 w-full">
          <ui-button
            (click)="send()"
            [disabled]="form.invalid || loaderStore.isEnable()"
            [label]="'Enviar email' | transloco"
            severity="primary"
          />
          <ui-button
            routerLink="/login"
            [label]="'Volver' | transloco"
            severity="secondary"
            variant="outlined"
            styleClass="!border !border-lino-200"
          />
        </div>
      </form>
    </div>
  </div>
</section>
