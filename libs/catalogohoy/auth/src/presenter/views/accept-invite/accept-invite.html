<div class="flex flex-col items-center justify-center min-h-screen gap-4 text-center p-6">
  @if (isLoading()) {
    <lucide-icon name="loader-circle" [size]="32" class="animate-spin text-violet-500" />
    <p class="text-grey-500 text-sm">Verificando tu invitación...</p>
  } @else if (errorMessage()) {
    <div class="flex flex-col items-center gap-3">
      <div class="w-14 h-14 bg-red-50 rounded-2xl flex items-center justify-center">
        <lucide-icon name="circle-x" [size]="28" class="text-red-500" />
      </div>
      <h2 class="text-lg font-semibold text-grey-700">Invitación inválida</h2>
      <p class="text-sm text-grey-400 max-w-xs">{{ errorMessage() }}</p>
    </div>
  }
</div>
