<div
  class="flex justify-center items-center h-screen bg-lino-500 overflow-hidden"
>
  <div class="flex flex-col gap-2 lg:p-36 md:p-52 sm:20 p-8 w-full lg:w-1/2">
    <div class="flex flex-col gap-6">
      <ui-icon
        name="https://yvkurjivijnhliofmfmj.supabase.co/storage/v1/object/public/catalogohoy/logo.svg"
        styleClass="h-20 rounded-lg"
        class="flex justify-center sm:justify-start"
      />
      <div class="flex flex-col gap-2">
        <h1 class="text-4xl sm:text-5xl font-semibold text-grey-700">
          Crea tu catálogo
        </h1>
        <span class="text-base sm:text-sm mb-4 text-grey-400">
          ¡Comienza a llenar tus datos y haz tu catálogo en minutos!
        </span>
      </div>
    </div>
    <form (keyup.enter)="send()" [formGroup]="form">
      <div class="mb-4">
        <label
          for="name"
          class="block font-medium text-base sm:text-sm text-grey-400"
          >Nombre</label
        >
        <ui-input-text
          inputId="name"
          formControlName="name"
          placeholder="Manuel"
        />
        <ui-input-message
          [control]="form.get('name')"
          error="required"
          text="El campo es obligatorio"
        />
        <ui-input-message
          [control]="form.get('name')"
          error="whitespace"
          text="No puede contener espacios en blanco"
        />
        <ui-input-message
          [control]="form.get('name')"
          error="minlength"
          text="Debe tener mínimo 4 caracteres"
        />
      </div>
      <div class="mb-4">
        <label
          for="storeName"
          class="block font-medium text-base sm:text-sm text-grey-400"
          >Nombre de la tienda</label
        >
        <ui-input-text
          inputId="storeName"
          formControlName="storeName"
          placeholder="Nombre de tu tienda"
        />
        <ui-input-message
          [control]="form.get('storeName')"
          error="required"
          text="El campo es obligatorio"
        />
        <ui-input-message
          [control]="form.get('storeName')"
          error="minlength"
          text="Debe tener mínimo 3 caracteres"
        />
      </div>
      <div class="mb-4">
        <label
          for="email"
          class="block font-medium text-base sm:text-sm text-grey-400"
          >Email</label
        >
        <ui-input-text
          inputId="email"
          formControlName="email"
          placeholder="manuel@catalogohoy.com"
        />
        <ui-input-message
          [control]="form.get('email')"
          error="required"
          text="El campo es obligatorio"
        />
        <ui-input-message
          [control]="form.get('email')"
          error="whitespace"
          text="No puede contener espacios en blanco"
        />
        <ui-input-message
          [control]="form.get('email')"
          error="email"
          text="El formato no es válido"
        />
      </div>

      <div class="mb-4">
        <label
          for="password"
          class="block font-medium text-base sm:text-sm text-grey-400"
          >Contraseña</label
        >
        <ui-input-password
          [feedback]="false"
          inputId="password"
          formControlName="password"
          placeholder="*********"
        />
        <ui-input-message
          [control]="form.get('password')"
          error="required"
          text="El campo es obligatorio"
        />
        <ui-input-message
          [control]="form.get('password')"
          error="whitespace"
          text="No puede contener espacios en blanco"
        />
        <ui-input-message
          [control]="form.get('password')"
          error="minlength"
          text="Debe tener mínimo 6 caracteres"
        />
      </div>

      <ui-button
        (click)="send()"
        [disabled]="form.invalid || loaderStore.isEnable()"
        label="Crear Catálogo"
        severity="primary"
        styleClass="mt-4"
      />
    </form>
    <div class="flex justify-center gap-1 mt-6 text-base text-center">
      <p class="font-semibold text-grey-400">¿Ya tienes una cuenta?</p>
      <a routerLink="/login" class="font-semibold text-blue-500"
        >Inicia sesión</a
      >
    </div>
  </div>
  <div class="w-1/2 h-screen hidden lg:block">
    <img
      src="https://yvkurjivijnhliofmfmj.supabase.co/storage/v1/object/public/catalogohoy/auth-side.svg"
      alt="Auth side"
      class="object-cover w-full h-full"
    />
  </div>
</div>
