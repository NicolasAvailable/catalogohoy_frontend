<section
  class="flex justify-center items-center h-screen bg-lino-500 lg:bg-[#eceefb] overflow-hidden"
>
  <div
    class="flex flex-col items-center justify-center w-full px-10 py-8 md:h-screen lg:py-0"
  >
    <div
      class="w-full p-6 rounded-lg lg:rounded-3xl border border-lino-200 lg:border-transparent shadow lg:shadow-none bg-lino-400 lg:bg-white md:mt-0 sm:max-w-md sm:p-8"
    >
      <h2
        class="mb-1 text-xl font-bold leading-tight tracking-tight text-grey-700 md:text-2xl"
      >
        {{ 'Escribe tu nueva contraseña' | transloco }}
      </h2>
      <form
        (keyup.enter)="send()"
        [formGroup]="form"
        class="mt-4 space-y-4 lg:mt-5 md:space-y-5"
      >
        <div>
          <label
            for="password"
            class="block mb-2 text-sm font-medium text-grey-400"
            >{{ 'Nueva Contraseña' | transloco }}</label
          >
          <ui-input-password
            [feedback]="false"
            formControlName="password"
            name="password"
            id="password"
            placeholder="••••••••"
          />
          <ui-input-message
            [control]="form.get('password')"
            error="required"
            [text]="'El campo es obligatorio' | transloco"
          />
          <ui-input-message
            [control]="form.get('password')"
            error="whitespace"
            [text]="'No puede contener espacios en blanco' | transloco"
          />
          <ui-input-message
            [control]="form.get('password')"
            error="minlength"
            [text]="'Debe tener mínimo 6 caracteres' | transloco"
          />
        </div>
        <div>
          <label
            for="confirm-password"
            class="block mb-2 text-sm font-medium text-grey-400"
            >{{ 'Confirmar Contraseña' | transloco }}</label
          >
          <ui-input-password
            [feedback]="false"
            formControlName="confirmPassword"
            name="confirm-password"
            id="confirm-password"
            placeholder="••••••••"
          />
          <ui-input-message
            [control]="form.get('confirmPassword')"
            error="required"
            [text]="'El campo es obligatorio' | transloco"
          />
          <ui-input-message
            [control]="form.get('confirmPassword')"
            error="whitespace"
            [text]="'No puede contener espacios en blanco' | transloco"
          />
          <ui-input-message
            [control]="form"
            error="confirmPassword"
            [text]="'Las contraseñas no coinciden' | transloco"
          />
        </div>

        <div class="flex flex-col gap-2 w-full">
          <ui-button
            (click)="send()"
            [disabled]="form.invalid || loaderStore.isEnable()"
            [label]="'Confirmar' | transloco"
            severity="primary"
          />
        </div>
      </form>
    </div>
  </div>
</section>
