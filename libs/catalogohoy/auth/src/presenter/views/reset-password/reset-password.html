<section
  class="flex justify-center items-center h-screen bg-lino-500 overflow-hidden"
>
  <div
    class="flex flex-col items-center justify-center w-full px-10 py-8 md:h-screen lg:py-0"
  >
    <div
      class="w-full p-6 rounded-lg border border-lino-200 shadow bg-lino-400 md:mt-0 sm:max-w-md d sm:p-8"
    >
      <h2
        class="mb-1 text-xl font-bold leading-tight tracking-tight text-grey-700 md:text-2xl"
      >
        Escribe tu nueva contraseña
      </h2>
      <form
        (keyup.enter)="send()"
        [formGroup]="form"
        class="mt-4 space-y-4 lg:mt-5 md:space-y-5"
      >
        <div>
          <label
            for="password"
            class="block mb-2 text-sm font-medium text-grey-400"
            >Nueva Contraseña</label
          >
          <ui-input-password
            [feedback]="false"
            formControlName="password"
            name="password"
            id="password"
            placeholder="••••••••"
          />
        </div>
        <div>
          <label
            for="confirm-password"
            class="block mb-2 text-sm font-medium text-grey-400"
            >Confirmar Contraseña</label
          >
          <ui-input-password
            [feedback]="false"
            formControlName="confirmPassword"
            name="confirm-password"
            id="confirm-password"
            placeholder="••••••••"
          />
        </div>

        <div class="flex flex-col gap-2 w-full">
          <ui-button
            (click)="send()"
            [disabled]="form.invalid || loaderStore.isEnable()"
            label="Confirmar"
            severity="primary"
          />
        </div>
      </form>
    </div>
  </div>
</section>
