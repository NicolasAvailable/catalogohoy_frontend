<!-- component -->
<div class="bg-gray-100 flex justify-center items-center h-screen">
  <!-- Left: Image -->
  <div class="w-1/2 h-screen hidden lg:block">
    <img
      src="https://placehold.co/800x/667fff/ffffff.png?text=Your+Image&font=Montserrat"
      alt="Placeholder Image"
      class="object-cover w-full h-full"
    />
  </div>
  <!-- Right: Login Form -->
  <div class="lg:p-36 md:p-52 sm:20 p-8 w-full lg:w-1/2">
    <h1 class="text-2xl font-semibold mb-4">Registro</h1>
    <form [formGroup]="form">
      <!-- Username Input -->
      <div class="mb-4">
        <label for="name" class="block text-gray-600">Nombre</label>
        <ui-input-text
          inputId="name"
          formControlName="name"
          placeholder="Manuel"
        />
      </div>
      <div class="mb-4">
        <label for="tenant" class="block text-gray-600"
          >Nombre de la tienda</label
        >
        <ui-input-text
          inputId="tenant"
          formControlName="tenant"
          placeholder="Nombre de tu tienda"
        />
      </div>
      <!-- Password Input -->
      <div class="mb-4">
        <label for="email" class="block text-gray-600">Email</label>
        <ui-input-text
          inputId="email"
          formControlName="email"
          placeholder="manuel@catalogohoy.com"
        />
      </div>

      <div class="mb-4">
        <label for="phone" class="block text-gray-600">Telefono</label>
        <ui-input-mask
          inputId="phone"
          formControlName="phone"
          mask="(999) 999-9999"
          placeholder="(412) 593-7398"
        />
      </div>

      <div class="mb-4">
        <label for="password" class="block text-gray-600">Contraseña</label>
        <ui-input-password
          [feedback]="false"
          inputId="password"
          formControlName="password"
          placeholder="*********"
        />
      </div>
      <!-- Remember Me Checkbox -->
      <div class="mb-4 flex items-center">
        <label for="remember" class="text-gray-600 ml-2">Remember Me</label>
      </div>
      <!-- Forgot Password Link -->
      <div class="mb-6 text-blue-500">
        <a href="#" class="hover:underline">Forgot Password?</a>
      </div>
      <!-- Login Button -->
      <ui-button (click)="send()" label="Registrarse" severity="primary" />
    </form>
    <!-- Sign up  Link -->
    <div class="mt-6 text-blue-500 text-center">
      <a href="#" class="hover:underline">Sign up Here</a>
    </div>
  </div>
</div>
