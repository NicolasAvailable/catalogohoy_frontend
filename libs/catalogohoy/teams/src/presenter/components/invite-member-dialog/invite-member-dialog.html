<ui-dialog styleClass="max-w-lg w-full">
  <div class="flex flex-col gap-4 p-2">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-violet-50 rounded-xl flex items-center justify-center shrink-0">
        <ui-icon name="user-plus" styleClass="size-5 text-violet-500" />
      </div>
      <div>
        <h3 class="font-semibold text-grey-700">Invitar miembro</h3>
        <p class="text-sm text-grey-300">Se enviará un email de invitación</p>
      </div>
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium text-grey-700" for="invite-email">
        Correo electrónico
      </label>
      <input
        id="invite-email"
        type="email"
        class="w-full rounded-lg border border-surface-300 px-3 py-2 text-sm outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500"
        placeholder="correo@ejemplo.com"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        (keydown.enter)="onInvite()"
      />
      @if (errorMessage()) {
        <p class="text-xs text-red-500">{{ errorMessage() }}</p>
      }
    </div>

    <div class="flex flex-col gap-1.5">
      <p class="text-sm font-medium text-grey-700">Permisos</p>
      <lib-permission-picker
        [hideActions]="true"
        [currentPermissions]="selectedPermissions()"
        (change)="onPermissionsChange($event)"
      />
    </div>

    <div class="flex gap-2 justify-end">
      <ui-button label="Cancelar" variant="outlined" (click)="onCancel()" />
      <ui-button
        label="Enviar invitación"
        icon="send"
        [isLoading]="teamStore.isInviting()"
        [disabled]="!isEmailValid()"
        (click)="onInvite()"
      />
    </div>
  </div>
</ui-dialog>
