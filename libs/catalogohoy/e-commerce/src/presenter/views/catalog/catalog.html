<div class="catalog">
  <!-- Filters and actions row -->
  <div class="catalog__toolbar">
    <div class="catalog__filters">
      <lib-category-filter
        [categories]="ecommerceStore.categories()"
        [selectedCategoryId]="ecommerceStore.selectedCategoryId()"
        (categorySelect)="onCategorySelect($event)"
      />
    </div>

    <div class="catalog__actions">
      <!-- Order Dropdown -->
      <div class="catalog__dropdown">
        <button
          class="catalog__dropdown-trigger"
          (click)="toggleOrderDropdown()"
        >
          <ui-icon name="arrowUpDown" styleClass="size-4" />
          <span>{{ getOrderLabel() }}</span>
          <ui-icon name="chevronDown" styleClass="size-4" />
        </button>

        @if (isOrderDropdownOpen()) {
        <div class="catalog__dropdown-menu">
          <button class="catalog__dropdown-item" (click)="setOrder(null)">
            Más recientes
          </button>
          <button class="catalog__dropdown-item" (click)="setOrder('name')">
            Nombre
          </button>
          <button
            class="catalog__dropdown-item"
            (click)="setOrder('price_asc')"
          >
            Menor precio
          </button>
          <button
            class="catalog__dropdown-item"
            (click)="setOrder('price_desc')"
          >
            Mayor precio
          </button>
        </div>
        }
      </div>

      <!-- View Mode Toggle -->
      <div class="catalog__view-toggle">
        <button
          class="catalog__view-btn"
          [class.catalog__view-btn--active]="viewMode() === 'grid'"
          (click)="setViewMode('grid')"
        >
          <ui-icon name="layoutGrid" styleClass="size-5" />
        </button>
        <button
          class="catalog__view-btn"
          [class.catalog__view-btn--active]="viewMode() === 'list'"
          (click)="setViewMode('list')"
        >
          <ui-icon name="list" styleClass="size-5" />
        </button>
      </div>
    </div>
  </div>

  <!-- Products Grid/List -->
  @if (ecommerceStore.isLoading()) {
  <div class="catalog__loading">
    <div class="catalog__loading-grid">
      @for (i of [1,2,3,4,5,6]; track i) {
      <div class="catalog__skeleton"></div>
      }
    </div>
  </div>
  } @else {
  <div
    class="catalog__products"
    [class.catalog__products--grid]="viewMode() === 'grid'"
    [class.catalog__products--list]="viewMode() === 'list'"
  >
    @for (product of ecommerceStore.productList().items; track product.id) {
    <lib-product-card
      [product]="product"
      [viewMode]="viewMode()"
      (addToCart)="cartStore.addProduct($event)"
    />
    } @empty {
    <div class="catalog__empty">
      <ui-icon name="packageSearch" styleClass="size-16" />
      <p>No se encontraron productos</p>
    </div>
    }
  </div>
  }
</div>
