@if (planStore.isPlanExpired()) {
<lib-catalog-expired />
} @else {
<div class="ecommerce">
  <lib-catalog-header />
  <lib-catalog-hero />

  <main
    class="ecommerce__content"
    [ngClass]="{ 'pt-0!': ecommerceStore.effectiveCatalogInfo()?.template !== 'classic' } "
  >
    <router-outlet />
  </main>

  <lib-catalog-footer />

  <lib-cart-drawer />
  <lib-checkout-drawer />
</div>
}
