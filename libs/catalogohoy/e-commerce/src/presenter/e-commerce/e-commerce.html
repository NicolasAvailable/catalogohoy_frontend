<div class="ecommerce" [class.ecommerce--standalone]="isStandaloneRoute()">
  @let isClassic = ecommerceStore.effectiveCatalogInfo()?.template === 'classic';

  @if (!isStandaloneRoute()) {
  @if (isClassic) {
    <lib-catalog-header />
  } @else {
    <!-- Top floating action buttons (Fatness-style) -->
    <nav class="ecommerce__top-actions">
      <button class="ecommerce__action-btn" [attr.aria-label]="'Favorito' | transloco" type="button">
        <ui-icon name="heart" styleClass="size-5" />
      </button>
      <button
        class="ecommerce__action-btn"
        [attr.aria-label]="'Compartir' | transloco"
        type="button"
        (click)="onShare()"
      >
        <ui-icon name="share2" styleClass="size-5" />
      </button>
      <a
        class="ecommerce__action-btn"
        aria-label="WhatsApp"
        [href]="whatsappUrl()"
        target="_blank"
        rel="noopener noreferrer"
      >
        <ui-icon name="messageCircle" styleClass="size-5" />
      </a>
    </nav>

    <lib-catalog-hero />
  }
  }

  <main
    class="ecommerce__content"
    [ngClass]="{ 'pt-0!': !isClassic || isStandaloneRoute() } "
  >
    <router-outlet />
  </main>

  @if (!isStandaloneRoute() && !isClassic && ecommerceStore.effectiveCatalogInfo()) {
    <!-- Floating cart pill bar (Fatness-style) — hidden for classic (uses
         navbar cart icon) AND while catalog config is still loading, so the
         pill never flashes in the default blue before the tenant's primary
         color palette gets applied. -->
    <button
      class="ecommerce__cart-pill"
      (click)="cartStore.openCart()"
      [attr.aria-label]="'Ver carrito' | transloco"
      type="button"
    >
      <ui-icon name="shoppingCart" styleClass="size-5" />
      <span>{{ 'Ver Carrito ({n})' | transloco: { n: cartStore.totalItems() } }}</span>
    </button>
  }

  @if (!isStandaloneRoute()) {
  <lib-catalog-footer />
  }

  <lib-cart-drawer />
  <lib-catalog-info-modal />
</div>
