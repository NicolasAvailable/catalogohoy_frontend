<nav class="category-filter-nav">
  <button
    type="button"
    class="category-filter-icon-btn"
    (click)="searchClick.emit()"
    [attr.aria-label]="'Buscar' | transloco"
  >
    <ui-icon name="search" styleClass="size-5" />
  </button>
  <button
    type="button"
    class="category-filter-icon-btn"
    (click)="filterClick.emit()"
    [attr.aria-label]="'Filtros' | transloco"
  >
    <ui-icon name="slidersHorizontal" styleClass="size-5" />
  </button>

  <p-tabs
    class="category-filter"
    [scrollable]="true"
    [value]="activeTab()"
    (valueChange)="onTabChange($event)"
  >
    <p-tablist>
      @if (!hasViewAllCategory() && !suppressAllTab()) {
        <p-tab [value]="allTabValue" data-initial="" data-all="true">{{ 'Ver todos' | transloco }}</p-tab>
      }
      @for (category of categories(); track category.id) {
        <p-tab
          [value]="category.isViewAll ? allTabValue : category.id"
          [attr.data-initial]="category.isViewAll ? '' : (category.name.trim().charAt(0) | uppercase)"
          [attr.data-all]="category.isViewAll ? 'true' : null"
          (pointerdown)="onTabPointerdown()"
          (click)="onTabClick(category)"
        >
          {{ category.name }}
        </p-tab>
      }
    </p-tablist>
  </p-tabs>
</nav>
