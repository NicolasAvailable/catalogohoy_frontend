<header class="catalog-header">
  <div class="catalog-header__container">
    <div class="catalog-header__left">
      <h1 class="catalog-header__title">
        {{ ecommerceStore.catalogInfo()?.name || 'Catálogo' }}
      </h1>
    </div>

    <div class="catalog-header__right">
      <div class="catalog-header__search">
        <ui-input-search
          placeholder="Buscar producto"
          (valueChange)="onSearch($event)"
          styleClass="rounded-base! gap-2!"
          iconStyleClass="size-5!"
        />
      </div>

      <button class="catalog-header__cart" (click)="cartStore.openCart()">
        <ui-icon name="shoppingCart" styleClass="size-6" />
        @if (cartStore.totalItems() > 0) {
        <span class="catalog-header__cart-badge"
          >{{ cartStore.totalItems() }}</span
        >
        }
      </button>
    </div>
  </div>
</header>
