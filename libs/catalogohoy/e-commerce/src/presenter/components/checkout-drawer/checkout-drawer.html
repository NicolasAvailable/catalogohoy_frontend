@if (cartStore.isCheckoutOpen()) {
<div class="checkout-drawer">
  <div
    class="checkout-drawer__backdrop"
    role="button"
    tabindex="0"
    (click)="onClose()"
    (keydown.enter)="onClose()"
    (keydown.escape)="onClose()"
  ></div>

  <div class="checkout-drawer__panel">
    <header class="checkout-drawer__header">
      <button class="checkout-drawer__back" (click)="onBack()">
        <ui-icon name="arrowLeft" styleClass="size-5" />
      </button>
      <h2 class="checkout-drawer__title">Datos de contacto</h2>
    </header>

    <div class="checkout-drawer__content">
      <form class="checkout-drawer__form" (ngSubmit)="onSubmit()">
        <div class="checkout-drawer__field">
          <label class="checkout-drawer__label" for="name">
            Nombre<span class="checkout-drawer__required">*</span>
          </label>
          <input
            type="text"
            id="name"
            class="checkout-drawer__input"
            [ngModel]="name()"
            (ngModelChange)="name.set($event)"
            name="name"
            placeholder="Tu nombre"
            required
          />
        </div>

        <div class="checkout-drawer__field">
          <label class="checkout-drawer__label" for="phone">
            Celular<span class="checkout-drawer__required">*</span>
          </label>
          <div class="checkout-drawer__phone-input">
            <div class="checkout-drawer__country-select">
              <select
                class="checkout-drawer__country-dropdown"
                [ngModel]="countryCode()"
                (ngModelChange)="setCountryCode($event)"
                name="countryCode"
              >
                @for (country of countryCodes; track country.code) {
                <option [value]="country.code">
                  {{ country.flag }} {{ country.code }}
                </option>
                }
              </select>
            </div>
            <input
              type="tel"
              id="phone"
              class="checkout-drawer__input checkout-drawer__input--phone"
              [ngModel]="phone()"
              (ngModelChange)="phone.set($event)"
              name="phone"
              placeholder="300 123 4567"
              required
            />
          </div>
        </div>

        <div class="checkout-drawer__field">
          <label class="checkout-drawer__label" for="comments">
            Comentarios de la orden
          </label>
          <textarea
            id="comments"
            class="checkout-drawer__textarea"
            [ngModel]="comments()"
            (ngModelChange)="comments.set($event)"
            name="comments"
            placeholder="Indicaciones especiales..."
            rows="4"
          ></textarea>
        </div>
      </form>
    </div>

    <footer class="checkout-drawer__footer">
      <button
        class="checkout-drawer__submit-btn"
        [disabled]="!isValid || ecommerceStore.isLoading()"
        (click)="onSubmit()"
      >
        @if (ecommerceStore.isLoading()) {
        <span>Procesando...</span>
        } @else {
        <div class="checkout-drawer__submit-count">
          {{ cartStore.totalItems() }}
        </div>
        <span>Hacer pedido</span>
        <div class="checkout-drawer__submit-price">
          ${{ cartStore.totalPrice() }}
          <ui-icon name="chevronRight" styleClass="size-5" />
        </div>
        }
      </button>
    </footer>
  </div>
</div>
}
