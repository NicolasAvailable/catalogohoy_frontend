<section class="report-detail">
  <header class="report-detail__header">
    <h1 class="text-2xl sm:text-4xl font-bold shrink truncate">
      {{ report()?.title ?? ('Reporte' | transloco) }}
    </h1>
    @if (report()) {
      <div class="flex gap-2 items-center flex-wrap justify-end">
        <ui-button
          icon="arrow-left"
          variant="outlined"
          severity="contrast"
          [fluid]="false"
          (click)="goBack()"
        />
        <ui-button
          icon="share2"
          variant="outlined"
          severity="contrast"
          [fluid]="false"
          (click)="copyLink()"
        />
        <ui-button
          class="hidden sm:block"
          [label]="'Abrir público' | transloco"
          icon="external-link"
          variant="outlined"
          severity="contrast"
          [fluid]="false"
          (click)="openPublicLink()"
        />
        <ui-button
          [label]="'Descargar' | transloco"
          icon="download"
          severity="primary"
          [fluid]="false"
          (click)="downloadDialog.show()"
          [isLoading]="isExporting()"
          [disabled]="isExporting()"
        />
      </div>
    }
  </header>

  @if (isLoading()) {
    <div class="report-detail__skeleton">
      <div class="report-detail__skeleton-head">
        <ui-skeleton-list [count]="1" width="3rem" height="3rem" borderRadius="0.5rem" />
        <div class="flex flex-col gap-2 flex-1">
          <ui-skeleton-list [count]="1" width="16rem" height="1.25rem" borderRadius="0.375rem" />
          <ui-skeleton-list [count]="1" width="10rem" height="0.9rem" borderRadius="0.375rem" />
        </div>
      </div>
      <div class="report-detail__skeleton-kpis">
        @for (i of [1,2,3,4]; track i) {
          <ui-skeleton-list [count]="1" width="100%" height="5rem" borderRadius="0.75rem" />
        }
      </div>
      <ui-skeleton-list [count]="1" width="100%" height="18rem" borderRadius="0.75rem" />
      <ui-skeleton-list [count]="1" width="100%" height="14rem" borderRadius="0.75rem" />
    </div>
  } @else if (report(); as r) {
    <div class="report-detail__surface" #reportRef>
      <lib-report-content
        [title]="r.title"
        [periodStart]="r.periodStart"
        [periodEnd]="r.periodEnd"
        [createdAt]="r.createdAt"
        [metrics]="r.metricsConfig"
        [snapshot]="r.snapshot"
        [branding]="branding()"
      />
    </div>
  }
</section>

<ui-dialog
  #downloadDialog
  [headerTitle]="'Descargar reporte' | transloco"
  styleClass="w-[calc(100vw-1.5rem)] sm:w-full max-w-xl rounded-2xl! overflow-hidden"
>
  <div class="flex flex-col gap-4 pb-2">
    <p class="text-sm text-gray-500">
      {{ 'Elige en qué formato quieres descargar el reporte.' | transloco }}
    </p>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <!-- PDF -->
      <button
        type="button"
        (click)="downloadDialog.hide(); downloadPdf()"
        [disabled]="isExporting()"
        class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-1 items-center text-left p-4 sm:flex sm:flex-col sm:items-center sm:gap-3 sm:p-6 sm:text-center border-2 border-gray-100 rounded-2xl hover:border-primary-400 hover:bg-primary-50/40 transition-all cursor-pointer disabled:opacity-60 disabled:cursor-wait"
      >
        <img src="/images/pdf.svg" alt="PDF" class="row-span-2 w-11 h-11 sm:w-14 sm:h-14" />
        <h3 class="text-base sm:text-lg font-bold text-gray-900">PDF</h3>
        <p class="text-sm text-gray-500 sm:text-center">
          {{ 'El reporte tal cual lo ves, con tu logo. Ideal para compartir.' | transloco }}
        </p>
      </button>

      <!-- Microsoft Excel -->
      <button
        type="button"
        (click)="downloadDialog.hide(); downloadExcel()"
        [disabled]="isExporting()"
        class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-1 items-center text-left p-4 sm:flex sm:flex-col sm:items-center sm:gap-3 sm:p-6 sm:text-center border-2 border-gray-100 rounded-2xl hover:border-primary-400 hover:bg-primary-50/40 transition-all cursor-pointer disabled:opacity-60 disabled:cursor-wait"
      >
        <img src="/images/excel.svg" alt="Microsoft Excel" class="row-span-2 w-11 h-11 sm:w-14 sm:h-14" />
        <h3 class="text-base sm:text-lg font-bold text-gray-900">Microsoft Excel</h3>
        <p class="text-sm text-gray-500 sm:text-center">
          {{ 'Archivo .xlsx con los datos en tablas, para sumar y filtrar.' | transloco }}
        </p>
      </button>
    </div>
  </div>
</ui-dialog>
