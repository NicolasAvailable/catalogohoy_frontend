<main class="public-report">
  @if (isLoading()) {
    <div class="public-report__skeleton">
      <div class="public-report__skeleton-head">
        <ui-skeleton-list [count]="1" width="3rem" height="3rem" borderRadius="0.5rem" />
        <div class="flex flex-col gap-2 flex-1">
          <ui-skeleton-list [count]="1" width="16rem" height="1.25rem" borderRadius="0.375rem" />
          <ui-skeleton-list [count]="1" width="10rem" height="0.9rem" borderRadius="0.375rem" />
        </div>
      </div>
      <div class="public-report__skeleton-kpis">
        @for (i of [1,2,3,4]; track i) {
          <ui-skeleton-list [count]="1" width="100%" height="5rem" borderRadius="0.75rem" />
        }
      </div>
      <ui-skeleton-list [count]="1" width="100%" height="16rem" borderRadius="0.75rem" />
      <ui-skeleton-list [count]="1" width="100%" height="14rem" borderRadius="0.75rem" />
    </div>
  } @else if (notFound()) {
    <div class="public-report__not-found">
      <ui-icon name="triangle-alert" styleClass="size-10 text-amber-500" />
      <h1>{{ 'Reporte no encontrado' | transloco }}</h1>
      <p>{{ 'Este link ya no está disponible o fue eliminado por el administrador del catálogo.' | transloco }}</p>
    </div>
  } @else if (report(); as r) {
    <lib-report-content
      [title]="r.title"
      [periodStart]="r.periodStart"
      [periodEnd]="r.periodEnd"
      [createdAt]="r.createdAt"
      [metrics]="r.metricsConfig"
      [snapshot]="r.snapshot"
      [branding]="{
        name: r.tenant.name,
        logo: r.tenant.logo,
        countryCode: r.tenant.countryCode,
        currencyCode: r.tenant.currencyCode,
        currencySymbol: r.tenant.currencySymbol
      }"
    />
  }
</main>
