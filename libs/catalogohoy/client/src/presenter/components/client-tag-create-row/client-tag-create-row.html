<div class="flex flex-col gap-2 p-2 border-t border-grey-100">
  <!-- Row 1: color palette -->
  <div class="flex items-center gap-1.5 flex-wrap">
    @for (c of palette; track c) {
      <button
        type="button"
        (click)="color.set(c)"
        [style.background-color]="c"
        class="w-5 h-5 rounded-full border-2 transition-transform shrink-0 cursor-pointer"
        [class.scale-110]="color() === c"
        [class.border-grey-700]="color() === c"
        [class.border-transparent]="color() !== c"
      ></button>
    }
  </div>

  <!-- Row 2: name input (full width) -->
  <ui-input-text
    placeholder="Nueva etiqueta..."
    size="small"
    styleClass="w-full"
    [ngModel]="name()"
    (ngModelChange)="name.set($event)"
    (keydown.enter)="create()"
  />

  <!-- Row 3: create button (full width) -->
  <ui-button
    icon="plus"
    label="Crear etiqueta"
    size="small"
    [disabled]="!name().trim()"
    [isLoading]="saving()"
    (click)="create()"
  />
</div>
